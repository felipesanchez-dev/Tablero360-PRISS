name: Respaldo del Excel de SharePoint

on:
  schedule:
    - cron: "*/5 * * * *" # cada 5 minutos (GitHub puede demorarlo unos minutos más)
  workflow_dispatch: # permite ejecutarlo manualmente desde la pestaña Actions

permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar Excel desde SharePoint
        env:
          SHARE_URL: ${{ vars.EXCEL_SHARE_URL }}
        run: |
          if [ -z "$SHARE_URL" ]; then
            echo "::error::Falta la variable de repositorio EXCEL_SHARE_URL (Settings → Secrets and variables → Actions → Variables)"
            exit 1
          fi
          # Convertir el vínculo compartido en descarga directa
          case "$SHARE_URL" in
            *download.aspx*) URL="$SHARE_URL" ;;
            *\?*)            URL="${SHARE_URL}&download=1" ;;
            *)               URL="${SHARE_URL}?download=1" ;;
          esac
          curl -sSL --fail -o matriz_nuevo.xlsx "$URL"
          # Validar que sea un xlsx real (empieza con 'PK') y no una página de login
          head -c 2 matriz_nuevo.xlsx | grep -q "PK" || { echo "::error::La descarga no es un xlsx válido. ¿El vínculo sigue siendo anónimo?"; exit 1; }
          mv matriz_nuevo.xlsx matriz.xlsx

      - name: Confirmar cambios si el archivo cambió
        run: |
          git config user.name "bot-respaldo"
          git config user.email "actions@github.com"
          git add matriz.xlsx
          git diff --cached --quiet && echo "Sin cambios en el Excel" || git commit -m "Respaldo automático del Excel $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
